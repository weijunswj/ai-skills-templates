[package]
name = "github-program-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Bounded native IPC validation for the Toolkit GitHub programme broker"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hmac = "=0.13.0"
sha2 = "=0.11.0"
getrandom = "=0.4.3"
zeroize = { version = "=1.9.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = true
