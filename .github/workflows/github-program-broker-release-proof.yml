name: GitHub Program Broker Release Proof
on:
  pull_request:
permissions:
  contents: read
env:
  BROKER_MANIFEST: repo/scripts/github-program-broker/Cargo.toml
  RUST_TOOLCHAIN: 1.98.0
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  security:
    name: Broker Dependency Security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-gnu
      - name: Pinned dependency security tools
        run: |
          set -euo pipefail
          cargo +1.98.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
          cargo audit --version
          cargo deny --version
      - name: Audit exact lock and dependency policy
        working-directory: repo/scripts/github-program-broker
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/broker-metadata.json"
          cargo +1.98.0 tree --locked
          cargo audit
          cargo deny check
  contract:
    name: Broker Contract
    needs: security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-gnu
      - name: Independent JSON Schema validator
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/broker-schema"
          "$RUNNER_TEMP/broker-schema/bin/python" -m pip --isolated install --disable-pip-version-check --no-input --index-url https://pypi.org/simple jsonschema==4.26.0 referencing==0.37.0 attrs==26.1.0 jsonschema-specifications==2025.9.1 rpds-py==2026.6.3 typing-extensions==4.16.0
      - name: Strict Rust and independent protocol checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/broker-contract-target
          BROKER_SCHEMA_PYTHON: ${{ runner.temp }}/broker-schema/bin/python
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          cargo +1.98.0 fmt --all --manifest-path "$BROKER_MANIFEST" -- --check
          cargo +1.98.0 check --locked --all-targets --manifest-path "$BROKER_MANIFEST"
          cargo +1.98.0 clippy --locked --all-targets --all-features --manifest-path "$BROKER_MANIFEST" -- -D warnings
          cargo +1.98.0 test --locked --manifest-path "$BROKER_MANIFEST"
          cargo +1.98.0 test --locked --release --manifest-path "$BROKER_MANIFEST"
          node --test repo/tests/toolkit-github-program-broker.test.cjs repo/tests/toolkit-github-program-broker-contract.test.cjs
          npm run validate:all
  CodeQL:
    name: Rust CodeQL
    needs: security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-gnu
      - name: Initialize Rust CodeQL
        id: codeql
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended
      - name: Exact-head Rust build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          echo "RUST_CODEQL_HEAD=$EXPECTED_HEAD_SHA"
          rustc +1.98.0 -Vv
          cargo +1.98.0 build --locked --target x86_64-unknown-linux-gnu --manifest-path "$BROKER_MANIFEST" 2>&1 | tee "$RUNNER_TEMP/broker-codeql-build.log"
      - name: Analyze Rust without Code Scanning upload
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: ${{ runner.temp }}/broker-sarif
      - name: Prove candidate extraction coverage
        env:
          CODEQL_CLI: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/codeql_databases/rust/results/codeql/rust-queries/queries"
          "$CODEQL_CLI" bqrs decode "$results/diagnostics/ExtractedFiles.bqrs" --format=csv > "$RUNNER_TEMP/broker-extracted.csv"
          "$CODEQL_CLI" bqrs decode "$results/diagnostics/ExtractionErrors.bqrs" --format=csv > "$RUNNER_TEMP/broker-extraction-errors.csv"
      - name: Self-test and adjudicate real Rust SARIF
        run: |
          python - <<'PY'
          import json, os, pathlib, re

          def adjudicate(doc):
              if doc.get('version') != '2.1.0' or not doc.get('runs'):
                  raise ValueError('SARIF_MISSING_OR_INVALID')
              security=[]; limitations=[]; query_rules=set()
              for run in doc['runs']:
                  driver=run['tool']['driver']
                  if driver.get('name') != 'CodeQL': raise ValueError('WRONG_ANALYZER')
                  rules={r['id']:r for component in [driver,*run['tool'].get('extensions',[])] for r in component.get('rules',[])}
                  for rid,rule in rules.items():
                      p=rule.get('properties',{})
                      if 'security' in p.get('tags',[]) or 'security-severity' in p: query_rules.add(rid)
                  for result in run.get('results',[]):
                      rid=result.get('ruleId')
                      if rid not in rules: raise ValueError('UNKNOWN_RESULT_RULE')
                      rule=rules[rid];props=rule.get('properties',{})
                      if 'security' in props.get('tags',[]) or 'security-severity' in props:
                          if not re.fullmatch(r'rust/[A-Za-z0-9_./-]+',rid): raise ValueError('INVALID_RULE_ID')
                          security.append(rid)
                      elif props.get('kind')=='metric' and rid.startswith(('rust/summary/','rust/telemetry/')):
                          continue
                      elif rid=='rust/diagnostics/successfully-extracted-files':
                          continue
                      else:
                          # A diagnostic cannot silently erase coverage or become a waived finding.
                          raise ValueError('UNADJUDICATED_NONSECURITY_RESULT')
                  for invocation in run.get('invocations',[]):
                      if invocation.get('executionSuccessful') is False: raise ValueError('ANALYSIS_INCOMPLETE')
                      for note in invocation.get('toolExecutionNotifications',[]):
                          if note.get('level') not in ('warning','error'): continue
                          locations=note.get('locations',[])
                          uris=[x.get('physicalLocation',{}).get('artifactLocation',{}).get('uri','') for x in locations]
                          if not uris or not all(re.search(r'/build/serde(?:_core)?-[^/]+/out/private\.rs$',u) for u in uris):
                              raise ValueError('EXTRACTION_ASSURANCE_GAP')
                          limitations.append('generated-serde-private.rs')
              return security,limitations,query_rules

          def extraction_log_notes(text):
              notes=[]
              for line in text.splitlines():
                  if not re.search(r'semantic analyzer unavailable|macro expansion will be skipped|extraction (?:failed|error)',line,re.I): continue
                  if not re.search(r'/build/serde(?:_core)?-[^/]+/out/private\.rs(?::\d+)*:',line):
                      raise ValueError('CANDIDATE_OR_UNKNOWN_EXTRACTION_LOSS')
                  notes.append('generated-serde-private.rs')
              return notes

          def gate(doc):
              evidence=adjudicate(doc)
              return (1 if evidence[0] else 0),evidence

          def synthetic(rules,results):
              return {'version':'2.1.0','runs':[{'tool':{'driver':{'name':'CodeQL','rules':rules}},'results':results}]}
          sec={'id':'rust/synthetic-security','properties':{'tags':['security'],'security-severity':'8.0','kind':'problem'}}
          metric={'id':'rust/summary/synthetic-metric','properties':{'kind':'metric'}}
          assert gate(synthetic([sec],[]))[0]==0
          assert gate(synthetic([sec],[{'ruleId':sec['id']}]))[0]==1
          assert adjudicate(synthetic([metric],[{'ruleId':metric['id']}]))[0]==[]
          try:
              adjudicate(synthetic([{'id':'rust/diagnostics/extraction-errors'}],[{'ruleId':'rust/diagnostics/extraction-errors'}]))
              raise AssertionError('diagnostic incorrectly accepted')
          except ValueError: pass
          try:
              adjudicate(synthetic([], [{'ruleId':'missing'}]))
              raise AssertionError('unknown rule incorrectly accepted')
          except ValueError: pass
          for uri,allowed in [('/target/build/serde-abc/out/private.rs',True),('/target/build/serde_core-abc/out/private.rs',True),('/repo/scripts/github-program-broker/src/protocol.rs',False)]:
              probe=synthetic([],[])
              probe['runs'][0]['invocations']=[{'executionSuccessful':True,'toolExecutionNotifications':[{'level':'warning','locations':[{'physicalLocation':{'artifactLocation':{'uri':uri}}}]}]}]
              try:
                  _,notes,_=adjudicate(probe)
                  assert allowed and notes
              except ValueError:
                  assert not allowed
          assert extraction_log_notes('WARN /target/build/serde-abc/out/private.rs:1:1: semantic analyzer unavailable: macro expansion will be skipped.')
          try:
              extraction_log_notes('WARN /repo/scripts/github-program-broker/src/protocol.rs:1:1: semantic analyzer unavailable: macro expansion will be skipped.')
              raise AssertionError('candidate semantic loss accepted')
          except ValueError: pass
          print('RUST_CODEQL_ADJUDICATOR_SELFTEST=PASS_ZERO_SECURITY_FAIL_ONE_SECURITY_CLASSIFY_DIAGNOSTICS')
          if os.environ.get('BROKER_SARIF_SELFTEST_ONLY')=='1': raise SystemExit(0)
          try:
              temp=pathlib.Path(os.environ['RUNNER_TEMP'])
              files=sorted((temp/'broker-sarif').glob('*.sarif'))
              if len(files)!=1: raise ValueError('SARIF_INVENTORY_INVALID')
              exit_code,(findings,limitations,rules)=gate(json.loads(files[0].read_text()))
              if len(rules)<16: raise ValueError('RUST_SECURITY_QUERY_COVERAGE_INCOMPLETE')
              extracted=(temp/'broker-extracted.csv').read_text().replace('\\','/')
              expected=['src/'+x+'.rs' for x in ['canonical','crypto','error','lib','main','protocol']]+['tests/contracts.rs']
              if not all('repo/scripts/github-program-broker/'+x in extracted for x in expected):
                  raise ValueError('CANDIDATE_EXTRACTION_COVERAGE_INCOMPLETE')
              errors=(temp/'broker-extraction-errors.csv').read_text().splitlines()[1:]
              if len(errors)>2 or any(not re.search(r'/build/serde(?:_core)?-[^/]+/out/private\.rs',x) for x in errors):
                  raise ValueError('CANDIDATE_EXTRACTION_DIAGNOSTIC')
              print('RUST_CODEQL_CANDIDATE_FILES_ANALYSED=7')
              print('RUST_CODEQL_SECURITY_QUERY_RULE_COUNT='+str(len(rules)))
              print('RUST_CODEQL_SECURITY_RESULT_COUNT='+str(len(findings)))
              print('RUST_CODEQL_SECURITY_RULE_IDS='+(','.join(sorted(set(findings))) or 'none'))
              build_log=(temp/'broker-codeql-build.log').read_text()
              log_notes=extraction_log_notes(build_log)
              db_logs=list((temp/'codeql_databases'/'rust'/'log').rglob('*.log'))
              if not db_logs: raise ValueError('EXTRACTOR_LOG_EVIDENCE_MISSING')
              for log in db_logs: log_notes.extend(extraction_log_notes(log.read_text(errors='replace')))
              print('CANDIDATE_EXTRACTION_ASSURANCE=COMPLETE_SEVEN_FILES_NO_MATERIAL_LOSS')
              print('GENERATED_DEPENDENCY_EXTRACTION_LIMITATION=KNOWN_SERDE_SERDE_CORE_PRIVATE_RS_SEMANTIC_AND_MACRO_LIMITATION')
              print('GENERATED_DEPENDENCY_LIMITATION_OBSERVED='+('YES' if errors or limitations or log_notes else 'NOT_OBSERVED_IN_THIS_RUN_KNOWN_LIMITATION_RETAINED'))
              print('RUST_CODEQL_UPLOAD=none')
              print('RUST_CODEQL_SECURITY_GATE='+('FAIL' if findings else 'PASS'))
              raise SystemExit(exit_code)
          except (ValueError,KeyError,TypeError,OSError):
              print('RUST_CODEQL_SECURITY_GATE=FAIL_INCOMPLETE_OR_UNCLASSIFIED_EVIDENCE')
              print('RUST_CODEQL_UPLOAD=none')
              raise SystemExit(1)
          PY
  release:
    name: ${{ matrix.name }} Broker Release Proof
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Ubuntu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain and target
        shell: pwsh
        env:
          BROKER_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target $env:BROKER_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test exact target with public-safe proof
        shell: pwsh
        env:
          BROKER_TARGET: ${{ matrix.target }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNNER_IMAGE: ${{ matrix.runner }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -ne $env:EXPECTED_HEAD_SHA) { throw 'exact-head mismatch' }
          $treeSha = (git rev-parse 'HEAD^{tree}').Trim()
          $started = (Get-Date).ToUniversalTime().ToString('o')
          $target = $env:BROKER_TARGET
          $manifest = $env:BROKER_MANIFEST
          $commands = [ordered]@{
            FMT = @('+1.98.0','fmt','--all','--manifest-path',$manifest,'--','--check')
            BUILD = @('+1.98.0','build','--locked','--release','--target',$target,'--manifest-path',$manifest)
            DEBUG_TEST = @('+1.98.0','test','--locked','--target',$target,'--manifest-path',$manifest)
            RELEASE_TEST = @('+1.98.0','test','--locked','--release','--target',$target,'--manifest-path',$manifest)
          }
          $proof = [System.Collections.Generic.List[string]]::new()
          $proof.Add("PR=$env:PR_NUMBER")
          $proof.Add("BASE_REF=$env:PR_BASE_REF")
          $proof.Add("BASE_SHA=$env:PR_BASE_SHA")
          $proof.Add("HEAD_SHA=$headSha")
          $proof.Add("TREE_SHA=$treeSha")
          $proof.Add("RUNNER_IMAGE=$env:RUNNER_IMAGE/$env:ImageVersion")
          $proof.Add("OS=$env:RUNNER_OS")
          $proof.Add("ARCH=$env:RUNNER_ARCH")
          $proof.Add("RUSTC=$((& rustc +1.98.0 -Vv) -join ' | ')")
          $proof.Add("CARGO=$(& cargo +1.98.0 -V)")
          $proof.Add('TOOLCHAIN=1.98.0')
          $proof.Add("TARGET=$target")
          $proof.Add("CARGO_LOCK_SHA256=$((Get-FileHash -Algorithm SHA256 repo/scripts/github-program-broker/Cargo.lock).Hash.ToLowerInvariant())")
          $canonicalLock = python -c "import hashlib,subprocess; print(hashlib.sha256(subprocess.check_output(['git','show','HEAD:repo/scripts/github-program-broker/Cargo.lock'])).hexdigest())"
          if ($LASTEXITCODE -ne 0) { throw 'canonical lock hash unavailable' }
          $proof.Add("CARGO_LOCK_CANONICAL_LF_SHA256=$canonicalLock")
          $failed = $false
          foreach ($entry in $commands.GetEnumerator()) {
            $commandArgs = $entry.Value
            $proof.Add("$($entry.Key)_COMMAND=cargo $($commandArgs -join ' ')")
            & cargo @commandArgs
            $status = $LASTEXITCODE
            $proof.Add("$($entry.Key)_EXIT=$status")
            if ($status -ne 0) { $failed = $true }
          }
          $binary = "repo/scripts/github-program-broker/target/$target/release/github-program-broker"
          if ($IsWindows) { $binary += '.exe' }
          if (!(Test-Path -LiteralPath $binary)) { throw 'release binary missing' }
          $proof.Add("BINARY_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant())")
          $proof.Add("BINARY_BYTES=$((Get-Item -LiteralPath $binary).Length)")
          $proof.Add("STARTED_AT=$started")
          $proof.Add("FINISHED_AT=$((Get-Date).ToUniversalTime().ToString('o'))")
          $proof.Add('BINARY_UPLOAD=none')
          $proof | ForEach-Object { Write-Output $_; Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_ }
          if ($failed) { exit 1 }
