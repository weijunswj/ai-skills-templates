name: GitHub Program Broker Release Proof
on:
  pull_request:
permissions:
  contents: read
env:
  BROKER_MANIFEST: repo/scripts/github-program-broker/Cargo.toml
  RUST_TOOLCHAIN: 1.98.0
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  security:
    name: Broker Dependency Security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-gnu
      - name: Pinned dependency security tools
        run: |
          set -euo pipefail
          cargo +1.98.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
          cargo audit --version
          cargo deny --version
      - name: Audit exact lock and dependency policy
        working-directory: repo/scripts/github-program-broker
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/broker-metadata.json"
          cargo +1.98.0 tree --locked
          cargo audit
          cargo deny check
  contract:
    name: Broker Contract
    needs: security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-gnu
      - name: Independent JSON Schema validator
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/broker-schema"
          "$RUNNER_TEMP/broker-schema/bin/python" -m pip --isolated install --disable-pip-version-check --no-input --index-url https://pypi.org/simple jsonschema==4.26.0 referencing==0.37.0 attrs==26.1.0 jsonschema-specifications==2025.9.1 rpds-py==2026.6.3 typing-extensions==4.16.0
      - name: Strict Rust and independent protocol checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/broker-contract-target
          BROKER_SCHEMA_PYTHON: ${{ runner.temp }}/broker-schema/bin/python
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          cargo +1.98.0 fmt --all --manifest-path "$BROKER_MANIFEST" -- --check
          cargo +1.98.0 check --locked --all-targets --manifest-path "$BROKER_MANIFEST"
          cargo +1.98.0 clippy --locked --all-targets --all-features --manifest-path "$BROKER_MANIFEST" -- -D warnings
          cargo +1.98.0 test --locked --manifest-path "$BROKER_MANIFEST"
          cargo +1.98.0 test --locked --release --manifest-path "$BROKER_MANIFEST"
          node --test repo/tests/toolkit-github-program-broker.test.cjs repo/tests/toolkit-github-program-broker-contract.test.cjs
          npm run validate:all
  CodeQL:
    name: Rust CodeQL
    needs: security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-gnu
      - name: Initialize Rust CodeQL
        id: codeql
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended
      - name: Exact-head Rust build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          echo "RUST_CODEQL_HEAD=$EXPECTED_HEAD_SHA"
          rustc +1.98.0 -Vv
          cargo +1.98.0 build --locked --target x86_64-unknown-linux-gnu --manifest-path "$BROKER_MANIFEST" 2>&1 | tee "$RUNNER_TEMP/broker-codeql-build.log"
      - name: Analyze Rust without Code Scanning upload
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: ${{ runner.temp }}/broker-sarif
      - name: Prove candidate extraction coverage
        env:
          CODEQL_CLI: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/codeql_databases/rust/results/codeql/rust-queries/queries"
          "$CODEQL_CLI" bqrs decode "$results/diagnostics/ExtractedFiles.bqrs" --format=csv > "$RUNNER_TEMP/broker-extracted.csv"
          "$CODEQL_CLI" bqrs decode "$results/diagnostics/ExtractionErrors.bqrs" --format=csv > "$RUNNER_TEMP/broker-extraction-errors.csv"
      - name: Self-test and adjudicate real Rust SARIF
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os, pathlib, re

          class EvidenceError(ValueError):
              pass

          def require(condition, code):
              if not condition: raise EvidenceError(code)

          CANDIDATE_FILES=['repo/scripts/github-program-broker/src/'+x+'.rs' for x in
                           ['canonical','crypto','error','lib','main','protocol']]+[
                           'repo/scripts/github-program-broker/tests/contracts.rs']
          LIMITATION_TEXT=re.compile(r'semantic analyzer unavailable(?: \(not included in files loaded from manifest\))?: macro expansion will be skipped\.')

          DIAGNOSTICS_LIVE=False

          def public_path(value, workspace):
              # Diagnostic rendering only; this never supplies a trusted extraction path.
              if not isinstance(value,str): return {'representation':'non-string'}
              original=value
              root=workspace.replace('\\','/').rstrip('/')
              for prefix in ['file://'+root,root] if root else []:
                  if value==prefix or value.startswith(prefix+'/'):
                      value='$WORKSPACE'+value[len(prefix):]
                      break
              public=r'(?:\$WORKSPACE/)?repo/scripts/github-program-broker/(?:target/(?:x86_64-unknown-linux-gnu/)?debug/build/serde(?:_core)?-[a-f0-9]{16}/out/private\.rs|src/(?:canonical|crypto|error|lib|main|protocol)\.rs|tests/contracts\.rs)'
              if value in ('$WORKSPACE','$WORKSPACE/') or re.fullmatch(public,value):
                  return {'representation':value,'workspace_prefix_replaced':value!=original}
              return {'representation':'redacted','length':len(original),
                      'sha256':hashlib.sha256(original.encode('utf-8')).hexdigest()}

          def diagnostic_record(path, message, source, locator, artifact, bases):
              workspace=os.environ.get('GITHUB_WORKSPACE','')
              record={'source':source,'locator':locator,'path':public_path(path,workspace),
                      'message':message if isinstance(message,str) and LIMITATION_TEXT.fullmatch(' '.join(message.split()))
                      and len(message)<=240 else '<redacted>'}
              if artifact is not None:
                  base_id=artifact.get('uriBaseId')
                  record['uri_base_id']=base_id if base_id in (None,'%SRCROOT%') else '<redacted>'
                  record['artifact_index_present']='index' in artifact
                  base=bases.get(base_id) if isinstance(bases,dict) else None
                  record['base_uri']=public_path(base.get('uri'),workspace) if isinstance(base,dict) else {'representation':'absent'}
                  record['base_parent_present']=isinstance(base,dict) and 'uriBaseId' in base
              return record

          def observed_limitation(path, message, source, locator, artifact=None, bases=None):
              try:
                  return generated_limitation(path,message)
              except EvidenceError:
                  if DIAGNOSTICS_LIVE:
                      print('RUST_CODEQL_REJECTED_DIAGNOSTIC='+json.dumps(
                          diagnostic_record(path,message,source,locator,artifact,bases),sort_keys=True))
                  raise

          def generated_limitation(path, message):
              path=path.replace('\\','/')
              require('..' not in path.split('/') and re.fullmatch(
                  r'(?:/|file:///)[^\s]+/build/serde(?:_core)?-[A-Za-z0-9_-]+/out/private\.rs',path),
                  'UNKNOWN_EXTRACTION_DIAGNOSTIC_PATH')
              require(LIMITATION_TEXT.fullmatch(' '.join(message.split())), 'UNKNOWN_EXTRACTION_DIAGNOSTIC')
              return 'serde_core' if '/build/serde_core-' in path else 'serde'

          def csv_records(text, entity, width):
              try:
                  rows=list(csv.reader(io.StringIO(text, newline=''), strict=True))
              except csv.Error:
                  raise EvidenceError('MALFORMED_BQRS_CSV') from None
              require(bool(rows), 'MISSING_BQRS_CSV_HEADER')
              header=rows.pop(0)
              require(len(header)==width and header[0]==entity and len(set(header))==width
                      and all(header), 'INVALID_BQRS_CSV_HEADER')
              require(all(len(row)==width and all(field.strip() for field in row) for row in rows),
                      'MALFORMED_BQRS_CSV_RECORD')
              return rows

          def extracted_files(text, workspace):
              rows=csv_records(text,'f',2)
              require(all(row[1]=='File successfully extracted.' for row in rows), 'UNKNOWN_EXTRACTION_RECORD')
              paths={row[0].replace('\\','/') for row in rows}
              root=workspace.replace('\\','/').rstrip('/')
              require(all(path in paths or root+'/'+path in paths for path in CANDIDATE_FILES),
                      'CANDIDATE_EXTRACTION_COVERAGE_INCOMPLETE')
              return len(CANDIDATE_FILES)

          def extraction_errors(text):
              rows=csv_records(text,'error',3)
              notes=[]
              for row_index,(diagnostic,message,severity) in enumerate(rows):
                  require(severity=='2', 'UNKNOWN_EXTRACTION_DIAGNOSTIC_SEVERITY')
                  match=re.fullmatch(r'Extraction failed in (\S+) with error (.+)',message,re.S)
                  require(match is not None, 'UNKNOWN_EXTRACTION_DIAGNOSTIC')
                  require(diagnostic==match[2], 'INCONSISTENT_EXTRACTION_DIAGNOSTIC')
                  notes.append(observed_limitation(match[1],diagnostic,'bqrs-csv',[row_index]))
              return notes

          def adjudicate(doc):
              require(isinstance(doc,dict) and doc.get('version')=='2.1.0'
                      and isinstance(doc.get('runs'),list) and bool(doc['runs']), 'SARIF_MISSING_OR_INVALID')
              security=[]; limitations=[]; query_rules=set()
              for run_index,run in enumerate(doc['runs']):
                  driver=run['tool']['driver']
                  require(driver.get('name')=='CodeQL', 'WRONG_ANALYZER')
                  rules={}
                  for component in [driver,*run['tool'].get('extensions',[])]:
                      require(isinstance(component.get('rules',[]),list), 'SARIF_RULES_INVALID')
                      for rule in component.get('rules',[]):
                          rid=rule['id']
                          require(isinstance(rid,str) and re.fullmatch(r'rust/[A-Za-z0-9_./-]+',rid), 'INVALID_RULE_ID')
                          require(rid not in rules, 'DUPLICATE_RULE_ID')
                          rules[rid]=rule
                          props=rule.get('properties',{})
                          if 'security' in props.get('tags',[]) or 'security-severity' in props: query_rules.add(rid)
                  require(isinstance(run.get('results'),list), 'SARIF_RESULTS_MISSING_OR_INVALID')
                  for result in run['results']:
                      rid=result.get('ruleId')
                      require(rid in rules, 'UNKNOWN_RESULT_RULE')
                      props=rules[rid].get('properties',{})
                      if rid in query_rules:
                          security.append(rid)
                      elif props.get('kind')=='metric' and rid.startswith(('rust/summary/','rust/telemetry/')):
                          continue
                      elif rid=='rust/diagnostics/successfully-extracted-files':
                          continue
                      else:
                          raise EvidenceError('UNADJUDICATED_NONSECURITY_RESULT')
                  invocations=run.get('invocations')
                  require(isinstance(invocations,list) and bool(invocations), 'ANALYSIS_COMPLETION_EVIDENCE_MISSING')
                  for invocation_index,invocation in enumerate(invocations):
                      require(invocation.get('executionSuccessful') is True, 'ANALYSIS_INCOMPLETE')
                      for kind in ['toolExecutionNotifications','toolConfigurationNotifications']:
                          for note_index,note in enumerate(invocation.get(kind,[])):
                              level=note.get('level','warning')
                              require(level in ('none','note','warning','error'), 'UNKNOWN_NOTIFICATION_LEVEL')
                              if level in ('none','note'): continue
                              locations=note.get('locations',[])
                              require(bool(locations), 'EXTRACTION_DIAGNOSTIC_PATH_MISSING')
                              for location_index,location in enumerate(locations):
                                  artifact=location['physicalLocation']['artifactLocation']
                                  limitations.append(observed_limitation(artifact['uri'],note['message']['text'],
                                      'sarif-notification',[run_index,invocation_index,kind,note_index,location_index],
                                      artifact,run.get('originalUriBaseIds',{})))
              return security,limitations,query_rules

          def extraction_log_notes(text, source='selftest-log', log_index=0):
              notes=[]
              for line_index,line in enumerate(text.splitlines()):
                  line=re.sub(r'\x1b\[[0-9;]*m','',line)
                  if not re.search(r'semantic analyzer unavailable|macro expansion will be skipped|extraction (?:failed|error)',line,re.I): continue
                  # CodeQL logs this query interpretation as metadata, even for zero errors.
                  # Exempt only this complete record, never arbitrary lines mentioning the query.
                  marker='Interpreted diagnostic query "Extraction errors" (rust/diagnostics/extraction-errors) at path '
                  prefix,separator,record=line.partition(marker)
                  if separator and re.fullmatch(r'\S+/codeql/rust-queries/queries/diagnostics/ExtractionErrors\.bqrs\.',record):
                      require(not re.search(r'warn|error|failed|semantic|macro',prefix,re.I), 'UNKNOWN_EXTRACTION_LOG_RECORD')
                      continue
                  match=re.search(r'(\S+/build/serde(?:_core)?-[A-Za-z0-9_-]+/out/private\.rs):\d+:\d+: (.+)$',line)
                  require(match is not None, 'CANDIDATE_OR_UNKNOWN_EXTRACTION_LOSS')
                  require(not re.search(r'extraction (?:failed|error)|semantic analyzer unavailable|macro expansion will be skipped',line[:match.start()],re.I),
                          'UNKNOWN_EXTRACTION_LOG_RECORD')
                  notes.append(observed_limitation(match[1],match[2],source,[log_index,line_index]))
              return notes

          def gate(doc):
              evidence=adjudicate(doc)
              return (1 if evidence[0] else 0),evidence

          def security_coverage(rules):
              require(len(rules)>=16, 'RUST_SECURITY_QUERY_COVERAGE_INCOMPLETE')

          def synthetic(rules,results):
              return {'version':'2.1.0','runs':[{'tool':{'driver':{'name':'CodeQL','rules':rules}},
                      'results':results,'invocations':[{'executionSuccessful':True}]}]}

          def selftest():
              def fails(code, call):
                  try: call()
                  except EvidenceError as error:
                      require(str(error)==code, 'SELFTEST_WRONG_FAILURE_CLASSIFICATION')
                  else: raise EvidenceError('SELFTEST_NEGATIVE_CASE_ACCEPTED')
              def csv_text(rows):
                  output=io.StringIO(newline=''); csv.writer(output).writerows(rows); return output.getvalue()
              sec={'id':'rust/synthetic-security','properties':{'tags':['security'],'security-severity':'8.0','kind':'problem'}}
              metric={'id':'rust/summary/synthetic-metric','properties':{'kind':'metric'}}
              require(gate(synthetic([sec],[]))[0]==0, 'SELFTEST_ZERO_SECURITY')
              require(gate(synthetic([sec],[{'ruleId':sec['id']}]))[0]==1, 'SELFTEST_ONE_SECURITY')
              require(adjudicate(synthetic([metric],[{'ruleId':metric['id']}]))[0]==[], 'SELFTEST_METRIC')
              fails('UNKNOWN_RESULT_RULE',lambda: adjudicate(synthetic([], [{'ruleId':'missing'}])))
              fails('UNADJUDICATED_NONSECURITY_RESULT',lambda: adjudicate(synthetic(
                  [{'id':'rust/diagnostics/extraction-errors'}],[{'ruleId':'rust/diagnostics/extraction-errors'}])))
              fails('RUST_SECURITY_QUERY_COVERAGE_INCOMPLETE',lambda: security_coverage({sec['id']}))
              fails('SARIF_MISSING_OR_INVALID',lambda: adjudicate({}))
              incomplete=synthetic([],[]); incomplete['runs'][0]['invocations'][0]['executionSuccessful']=False
              fails('ANALYSIS_INCOMPLETE',lambda: adjudicate(incomplete))
              del incomplete['runs'][0]['invocations']
              fails('ANALYSIS_COMPLETION_EVIDENCE_MISSING',lambda: adjudicate(incomplete))
              extracted=[['f','col1']]+[['/workspace/'+x,'File successfully extracted.'] for x in CANDIDATE_FILES]
              require(extracted_files(csv_text(extracted),'/workspace')==7, 'SELFTEST_EXTRACTION')
              fails('CANDIDATE_EXTRACTION_COVERAGE_INCOMPLETE',lambda: extracted_files(csv_text(extracted[:-1]),'/workspace'))
              spoofed=[row[:] for row in extracted]; spoofed[-1][0]+='.unextracted'
              fails('CANDIDATE_EXTRACTION_COVERAGE_INCOMPLETE',lambda: extracted_files(csv_text(spoofed),'/workspace'))
              message='semantic analyzer unavailable (not included in files loaded from manifest):\nmacro expansion will be skipped.'
              header=['error','col1','col2']
              def error_row(path,diagnostic=message):
                  return [diagnostic,'Extraction failed in '+path+' with error '+diagnostic,'2']
              rows=[error_row('/target/build/'+crate+'-abc/out/private.rs') for crate in ['serde','serde_core','serde']]
              single=csv_text([header,rows[0]])
              require(len(csv_records(single,'error',3))==1, 'SELFTEST_MULTILINE_RECORD_COUNT')
              require(extraction_errors(single)==['serde'], 'SELFTEST_SERDE_LIMITATION')
              require(extraction_errors(csv_text([header,rows[1]]))==['serde_core'], 'SELFTEST_SERDE_CORE_LIMITATION')
              require(extraction_errors(csv_text([header,*rows]))==['serde','serde_core','serde'], 'SELFTEST_MULTIPLE_LOGICAL_RECORDS')
              require(extraction_errors(csv_text([header]))==[], 'SELFTEST_ZERO_ERRORS')
              fails('UNKNOWN_EXTRACTION_DIAGNOSTIC_PATH',lambda: extraction_errors(csv_text([header,error_row('/workspace/'+CANDIDATE_FILES[0])])))
              fails('UNKNOWN_EXTRACTION_DIAGNOSTIC_PATH',lambda: extraction_errors(csv_text([header,error_row('/target/build/unknown-abc/out/private.rs')])))
              fails('UNKNOWN_EXTRACTION_DIAGNOSTIC',lambda: extraction_errors(csv_text([header,error_row('/target/build/serde-abc/out/private.rs','unknown error')])))
              fails('MALFORMED_BQRS_CSV',lambda: extraction_errors('error,col1,col2\n"unterminated'))
              fails('MALFORMED_BQRS_CSV',lambda: extraction_errors('error,col1,col2\n"x"junk,y,2\n'))
              fails('MALFORMED_BQRS_CSV_RECORD',lambda: extraction_errors('error,col1,col2\nx,y\n'))
              fails('MISSING_BQRS_CSV_HEADER',lambda: extraction_errors(''))
              fails('INVALID_BQRS_CSV_HEADER',lambda: extraction_errors('wrong,col1,col2\n'))
              for crate in ['serde','serde_core']:
                  path='/target/build/'+crate+'-abc/out/private.rs'
                  plain=message.replace('\n',' ')
                  require(extraction_log_notes('WARN '+path+':1:1: '+plain)==[crate], 'SELFTEST_LOG_LIMITATION')
                  probe=synthetic([],[])
                  probe['runs'][0]['invocations'][0]['toolExecutionNotifications']=[{'level':'warning','message':{'text':plain},
                      'locations':[{'physicalLocation':{'artifactLocation':{'uri':path}}}]}]
                  require(adjudicate(probe)[1]==[crate], 'SELFTEST_SARIF_LIMITATION')
                  probe['runs'][0]['invocations'][0]['toolExecutionNotifications'][0]['message']['text']='unknown failure'
                  fails('UNKNOWN_EXTRACTION_DIAGNOSTIC',lambda: adjudicate(probe))
              metadata='Interpreted diagnostic query "Extraction errors" (rust/diagnostics/extraction-errors) at path /temp/codeql_databases/rust/results/codeql/rust-queries/queries/diagnostics/ExtractionErrors.bqrs.'
              require(extraction_log_notes('[2026-09-07 00:21:38] [INFO] '+metadata)==[], 'SELFTEST_QUERY_METADATA')
              fails('UNKNOWN_EXTRACTION_LOG_RECORD',lambda: extraction_log_notes('ERROR '+metadata))
              fails('CANDIDATE_OR_UNKNOWN_EXTRACTION_LOSS',lambda: extraction_log_notes(metadata+' extraction failed'))
              fails('CANDIDATE_OR_UNKNOWN_EXTRACTION_LOSS',lambda: extraction_log_notes('WARN /workspace/'+CANDIDATE_FILES[0]+':1:1: '+message.replace('\n',' ')))
              fails('UNKNOWN_EXTRACTION_DIAGNOSTIC',lambda: extraction_log_notes('WARN /target/build/serde-abc/out/private.rs:1:1: extraction failed'))
              print('RUST_CODEQL_ADJUDICATOR_SELFTEST=PASS_ZERO_SECURITY_FAIL_ONE_SECURITY_CLASSIFY_DIAGNOSTICS')
              require(public_path('/private/person/token','/workspace')['representation']=='redacted', 'SELFTEST_DIAGNOSTIC_PRIVACY')
              require(public_path('/workspace/../private','/workspace')['representation']=='redacted', 'SELFTEST_DIAGNOSTIC_TRAVERSAL_PRIVACY')
              require(public_path('/workspace','/workspace')['representation']=='$WORKSPACE', 'SELFTEST_DIAGNOSTIC_ROOT')
              require(diagnostic_record('/private/person/token','unknown secret','selftest',[],None,None)['message']=='<redacted>', 'SELFTEST_DIAGNOSTIC_MESSAGE_PRIVACY')
              print('RUST_CODEQL_CSV_SELFTEST=PASS_STRUCTURAL_MULTILINE_EXACT_LOGICAL_COUNTS_AND_NEGATIVE_CASES')

          def read_evidence(path, code):
              require(path.is_file(),code)
              return path.read_text(encoding='utf-8')

          def main():
              global DIAGNOSTICS_LIVE
              selftest()
              if os.environ.get('BROKER_SARIF_SELFTEST_ONLY')=='1': return 0
              DIAGNOSTICS_LIVE=True
              temp=pathlib.Path(os.environ['RUNNER_TEMP'])
              files=sorted((temp/'broker-sarif').glob('*.sarif'))
              require(len(files)==1, 'SARIF_INVENTORY_INVALID')
              exit_code,(findings,limitations,rules)=gate(json.loads(read_evidence(files[0],'SARIF_MISSING')))
              security_coverage(rules)
              count=extracted_files(read_evidence(temp/'broker-extracted.csv','EXTRACTED_FILES_EVIDENCE_MISSING'),os.environ['GITHUB_WORKSPACE'])
              errors=extraction_errors(read_evidence(temp/'broker-extraction-errors.csv','EXTRACTION_ERRORS_EVIDENCE_MISSING'))
              build_log=read_evidence(temp/'broker-codeql-build.log','BUILD_LOG_EVIDENCE_MISSING')
              log_notes=extraction_log_notes(build_log,'build-log')
              db_logs=sorted((temp/'codeql_databases'/'rust'/'log').rglob('*.log'))
              require(bool(db_logs), 'EXTRACTOR_LOG_EVIDENCE_MISSING')
              for log_index,log in enumerate(db_logs):
                  log_notes.extend(extraction_log_notes(read_evidence(log,'EXTRACTOR_LOG_EVIDENCE_MISSING'),'database-log',log_index))
              print('RUST_CODEQL_CANDIDATE_FILES_ANALYSED='+str(count))
              print('RUST_CODEQL_SECURITY_QUERY_RULE_COUNT='+str(len(rules)))
              print('RUST_CODEQL_SECURITY_RESULT_COUNT='+str(len(findings)))
              print('RUST_CODEQL_SECURITY_RULE_IDS='+(','.join(sorted(set(findings))) or 'none'))
              print('RUST_CODEQL_EXTRACTION_ERROR_LOGICAL_RECORD_COUNT='+str(len(errors)))
              print('CANDIDATE_EXTRACTION_ASSURANCE=COMPLETE_SEVEN_FILES_NO_MATERIAL_LOSS')
              print('GENERATED_DEPENDENCY_EXTRACTION_LIMITATION=KNOWN_SERDE_SERDE_CORE_PRIVATE_RS_SEMANTIC_AND_MACRO_LIMITATION')
              print('GENERATED_DEPENDENCY_LIMITATION_OBSERVED='+('YES' if errors or limitations or log_notes else 'NOT_OBSERVED_IN_THIS_RUN_KNOWN_LIMITATION_RETAINED'))
              print('GENERATED_DEPENDENCY_LIMITATION_CRATES='+(','.join(sorted(set(errors+limitations+log_notes))) or 'none_observed'))
              print('RUST_CODEQL_UPLOAD=none')
              if findings: print('RUST_CODEQL_EVIDENCE_ERROR=SECURITY_FINDINGS_PRESENT')
              print('RUST_CODEQL_SECURITY_GATE='+('FAIL' if findings else 'PASS'))
              return exit_code

          try:
              raise SystemExit(main())
          except (ValueError,KeyError,TypeError,OSError,AttributeError,IndexError,AssertionError) as error:
              if isinstance(error,EvidenceError): code=str(error)
              elif isinstance(error,json.JSONDecodeError): code='MALFORMED_SARIF_JSON'
              elif isinstance(error,UnicodeError): code='INVALID_EVIDENCE_ENCODING'
              elif isinstance(error,OSError): code='EVIDENCE_IO_ERROR'
              elif isinstance(error,AssertionError): code='ADJUDICATOR_SELFTEST_FAILED'
              else: code='MALFORMED_EVIDENCE_STRUCTURE'
              print('RUST_CODEQL_EVIDENCE_ERROR='+code)
              print('CANDIDATE_EXTRACTION_ASSURANCE=INCOMPLETE_OR_UNCLASSIFIED')
              print('GENERATED_DEPENDENCY_EXTRACTION_LIMITATION=UNADJUDICATED_KNOWN_LIMITATION_RETAINED')
              print('RUST_CODEQL_SECURITY_GATE=FAIL_INCOMPLETE_OR_UNCLASSIFIED_EVIDENCE')
              print('RUST_CODEQL_UPLOAD=none')
              raise SystemExit(1)
          PY
  release:
    name: ${{ matrix.name }} Broker Release Proof
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Ubuntu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain and target
        shell: pwsh
        env:
          BROKER_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --target $env:BROKER_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test exact target with public-safe proof
        shell: pwsh
        env:
          BROKER_TARGET: ${{ matrix.target }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNNER_IMAGE: ${{ matrix.runner }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -ne $env:EXPECTED_HEAD_SHA) { throw 'exact-head mismatch' }
          $treeSha = (git rev-parse 'HEAD^{tree}').Trim()
          $started = (Get-Date).ToUniversalTime().ToString('o')
          $target = $env:BROKER_TARGET
          $manifest = $env:BROKER_MANIFEST
          $commands = [ordered]@{
            FMT = @('+1.98.0','fmt','--all','--manifest-path',$manifest,'--','--check')
            BUILD = @('+1.98.0','build','--locked','--release','--target',$target,'--manifest-path',$manifest)
            DEBUG_TEST = @('+1.98.0','test','--locked','--target',$target,'--manifest-path',$manifest)
            RELEASE_TEST = @('+1.98.0','test','--locked','--release','--target',$target,'--manifest-path',$manifest)
          }
          $proof = [System.Collections.Generic.List[string]]::new()
          $proof.Add("PR=$env:PR_NUMBER")
          $proof.Add("BASE_REF=$env:PR_BASE_REF")
          $proof.Add("BASE_SHA=$env:PR_BASE_SHA")
          $proof.Add("HEAD_SHA=$headSha")
          $proof.Add("TREE_SHA=$treeSha")
          $proof.Add("RUNNER_IMAGE=$env:RUNNER_IMAGE/$env:ImageVersion")
          $proof.Add("OS=$env:RUNNER_OS")
          $proof.Add("ARCH=$env:RUNNER_ARCH")
          $proof.Add("RUSTC=$((& rustc +1.98.0 -Vv) -join ' | ')")
          $proof.Add("CARGO=$(& cargo +1.98.0 -V)")
          $proof.Add('TOOLCHAIN=1.98.0')
          $proof.Add("TARGET=$target")
          $proof.Add("CARGO_LOCK_SHA256=$((Get-FileHash -Algorithm SHA256 repo/scripts/github-program-broker/Cargo.lock).Hash.ToLowerInvariant())")
          $canonicalLock = python -c "import hashlib,subprocess; print(hashlib.sha256(subprocess.check_output(['git','show','HEAD:repo/scripts/github-program-broker/Cargo.lock'])).hexdigest())"
          if ($LASTEXITCODE -ne 0) { throw 'canonical lock hash unavailable' }
          $proof.Add("CARGO_LOCK_CANONICAL_LF_SHA256=$canonicalLock")
          $failed = $false
          foreach ($entry in $commands.GetEnumerator()) {
            $commandArgs = $entry.Value
            $proof.Add("$($entry.Key)_COMMAND=cargo $($commandArgs -join ' ')")
            & cargo @commandArgs
            $status = $LASTEXITCODE
            $proof.Add("$($entry.Key)_EXIT=$status")
            if ($status -ne 0) { $failed = $true }
          }
          $binary = "repo/scripts/github-program-broker/target/$target/release/github-program-broker"
          if ($IsWindows) { $binary += '.exe' }
          if (!(Test-Path -LiteralPath $binary)) { throw 'release binary missing' }
          $proof.Add("BINARY_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant())")
          $proof.Add("BINARY_BYTES=$((Get-Item -LiteralPath $binary).Length)")
          $proof.Add("STARTED_AT=$started")
          $proof.Add("FINISHED_AT=$((Get-Date).ToUniversalTime().ToString('o'))")
          $proof.Add('BINARY_UPLOAD=none')
          $proof | ForEach-Object { Write-Output $_; Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_ }
          if ($failed) { exit 1 }
